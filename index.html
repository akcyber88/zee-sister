<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halaman Privat &mdash; صفحة خاصة</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:"Segoe UI","Tahoma","DejaVu Sans",Arial,sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#FFE3EC 0%,#FFD9C0 25%,#E8D9FF 55%,#CDEBFF 80%,#D6FFF1 100%);
    background-attachment:fixed;padding:20px;color:#2B1B3D;
  }
  .card{
    background:rgba(255,253,248,.92);border:3px solid #fff;border-radius:28px;
    padding:38px 26px;max-width:430px;width:100%;text-align:center;
    box-shadow:0 18px 44px rgba(120,80,160,.22);
  }
  .lock{font-size:52px;line-height:1;display:block;margin-bottom:14px;animation:beat 1.6s ease-in-out infinite;}
  @keyframes beat{0%,100%{transform:scale(1);}25%{transform:scale(1.15);}40%{transform:scale(1);}}
  h1{font-size:24px;color:#5B2A86;margin-bottom:8px;}
  .ar{direction:rtl;font-size:17px;color:#7A5C99;margin-bottom:20px;line-height:1.8;}
  .id{font-size:15.5px;color:#6B5A80;margin-bottom:22px;line-height:1.7;}
  input{
    width:100%;padding:15px 16px;font-size:17px;border:2px solid #E4D7F5;border-radius:16px;
    outline:none;text-align:center;background:#FBF8FF;color:#3A2154;font-family:inherit;
    transition:border-color .2s;
  }
  input:focus{border-color:#B98CFF;}
  button{
    margin-top:14px;width:100%;border:none;cursor:pointer;font-family:inherit;
    font-size:17px;font-weight:800;color:#fff;padding:15px;border-radius:16px;
    background:linear-gradient(135deg,#FF6A88,#B98CFF);
    box-shadow:0 8px 0 rgba(0,0,0,.10),0 12px 22px rgba(150,100,200,.28);
    transition:transform .12s;
  }
  button:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(0,0,0,.10);}
  .err{margin-top:14px;font-size:14px;color:#C22F52;min-height:20px;line-height:1.6;}
  .foot{margin-top:22px;font-size:12px;color:#A99BBB;line-height:1.7;}
  .shake{animation:sh .4s ease;}
  @keyframes sh{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}
</style>
</head>
<body>
<div class="card" id="card">
  <span class="lock">&#128272;</span>
  <h1>Halaman Privat</h1>
  <div class="ar">الصفحة دي خاصة &mdash; ليكي وليا بس</div>
  <div class="id">Masukkan kata rahasia untuk membuka hadiahmu &#128156;</div>
  <input id="pw" type="password" inputmode="text" autocomplete="off"
         placeholder="Kata rahasia &bull; الكلمة السرية">
  <button id="go" onclick="unlock()">Buka Hadiah &bull; افتح الهدية</button>
  <div class="err" id="err"></div>
  <div class="foot">Dibuat dengan cinta, khusus untukmu &bull; صُنعت بحبٍّ خصيصًا لكِ</div>
</div>

var ITERS = 100000;

/*LOCK-CORE-START*/
function b64ToBytes(b64){
  var bin = atob(b64);
  var u = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u;
}
async function decryptBlob(password){
  var salt = b64ToBytes(SALT_B64), iv = b64ToBytes(IV_B64), ct = b64ToBytes(CT_B64);
  var km = await crypto.subtle.importKey('raw', new TextEncoder().encode(password),
           'PBKDF2', false, ['deriveBits', 'deriveKey']);
  var key = await crypto.subtle.deriveKey(
           {name:'PBKDF2', salt:salt, iterations:ITERS, hash:'SHA-256'}, km,
           {name:'AES-GCM', length:256}, false, ['decrypt']);
  var plainBuf = await crypto.subtle.decrypt({name:'AES-GCM', iv:iv}, key, ct);
  return new TextDecoder().decode(plainBuf);
}
/*LOCK-CORE-END*/

async function unlock(){
  var pw = document.getElementById('pw').value;
  var err = document.getElementById('err');
  var card = document.getElementById('card');
  if (!pw){ err.textContent = 'Tulis kata rahasia dulu ya — اكتبي الكلمة السرية الأول'; return; }
  try {
    var html = await decryptBlob(pw);
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    err.textContent = 'Kata rahasia salah, coba lagi ya — الكلمة السرية غلط، جرّبي تاني';
    card.classList.remove('shake');
    void card.offsetWidth;
    card.classList.add('shake');
  }
}
document.getElementById('pw').addEventListener('keydown', function(e){
  if (e.key === 'Enter') unlock();
});
